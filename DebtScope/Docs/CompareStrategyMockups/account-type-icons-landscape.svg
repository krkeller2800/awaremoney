<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="accountClip">
      <rect x="0" y="0" width="132" height="28"/>
    </clipPath>
    <clipPath id="compactAccountClip">
      <rect x="0" y="0" width="84" height="24"/>
    </clipPath>
  </defs>

  <rect width="960" height="360" fill="#F2F2F7"/>
  <text x="48" y="42" fill="#1C1C1E" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="700">Landscape Account Type Icons</text>
  <text x="48" y="70" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14">Fixed-width icon markers inside the Account column. Long names must truncate before APR.</text>

  <g transform="translate(48 98)">
    <rect x="0" y="0" width="864" height="214" rx="12" fill="#FFFFFF"/>
    <rect x="0.5" y="0.5" width="863" height="213" rx="11.5" stroke="#D1D1D6"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#6E6E73">
      <text x="18" y="34">Account</text>
      <text x="188" y="34" text-anchor="end">APR</text>
      <text x="318" y="34" text-anchor="end">Balance</text>
      <text x="462" y="34" text-anchor="end">Payment/mo</text>
      <text x="606" y="34" text-anchor="end">Interest/mo</text>
      <text x="750" y="34" text-anchor="end">Total Interest</text>
      <text x="846" y="34" text-anchor="end">Payoff</text>
    </g>

    <line x1="0" y1="52" x2="864" y2="52" stroke="#D1D1D6"/>
    <line x1="0" y1="104" x2="864" y2="104" stroke="#E5E5EA"/>
    <line x1="0" y1="156" x2="864" y2="156" stroke="#E5E5EA"/>

    <!-- Normal landscape width: account column gets an icon and a truncated name. -->
    <g transform="translate(18 70)" clip-path="url(#accountClip)">
      <rect x="0" y="4" width="18" height="13" rx="2.5" stroke="#8E8E93" stroke-width="1.6"/>
      <line x1="1.5" y1="8" x2="16.5" y2="8" stroke="#8E8E93" stroke-width="1.5"/>
      <line x1="4" y1="14" x2="8" y2="14" stroke="#8E8E93" stroke-width="1.3" stroke-linecap="round"/>
      <text x="27" y="18" fill="#1C1C1E" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="17" font-weight="700">Summit Visa...</text>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" fill="#1C1C1E">
      <text x="188" y="88" text-anchor="end">22.99%</text>
      <text x="318" y="88" text-anchor="end" fill="#D70015">$4,286</text>
      <text x="462" y="88" text-anchor="end">$139</text>
      <text x="606" y="88" text-anchor="end">$82</text>
      <text x="750" y="88" text-anchor="end">$2,154</text>
      <text x="846" y="88" text-anchor="end">Nov 2028</text>
    </g>

    <g transform="translate(18 122)" clip-path="url(#accountClip)">
      <path d="M4 2H13L18 7V21H4V2Z" stroke="#8E8E93" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M13 2V7.5H18" stroke="#8E8E93" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="7" y1="12" x2="15" y2="12" stroke="#8E8E93" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="7" y1="16" x2="14" y2="16" stroke="#8E8E93" stroke-width="1.3" stroke-linecap="round"/>
      <text x="27" y="19" fill="#1C1C1E" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="17" font-weight="700">Pinecrest Loan</text>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" fill="#1C1C1E">
      <text x="188" y="140" text-anchor="end">8.25%</text>
      <text x="318" y="140" text-anchor="end" fill="#D70015">$11,940</text>
      <text x="462" y="140" text-anchor="end">$310</text>
      <text x="606" y="140" text-anchor="end">$82</text>
      <text x="750" y="140" text-anchor="end">$1,028</text>
      <text x="846" y="140" text-anchor="end">Mar 2029</text>
    </g>

    <!-- Compact account-width stress sample -->
    <g transform="translate(18 176)">
      <text x="0" y="15" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600">Compact stress:</text>
      <g transform="translate(112 -4)" clip-path="url(#compactAccountClip)">
        <rect x="0" y="5" width="14" height="10" rx="2" stroke="#8E8E93" stroke-width="1.4"/>
        <line x1="1" y1="8" x2="13" y2="8" stroke="#8E8E93" stroke-width="1.2"/>
        <text x="20" y="16" fill="#1C1C1E" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="700">Harbor...</text>
      </g>
      <text x="214" y="15" fill="#6E6E73" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">At the narrowest width, the icon works but account names lose several characters.</text>
    </g>
  </g>

  <g transform="translate(48 338)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#6E6E73">
    <text x="0" y="0">Recommendation: implement only if the extra type signal is worth more truncation. Otherwise keep the account column text-only.</text>
  </g>
</svg>
