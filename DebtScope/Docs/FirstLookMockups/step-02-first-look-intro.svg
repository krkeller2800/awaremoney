<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#eef2f7"/>
  <rect x="24" y="20" width="342" height="804" rx="42" fill="#111827"/>
  <rect x="36" y="44" width="318" height="756" rx="32" fill="#f8fafc"/>
  <rect x="150" y="32" width="90" height="18" rx="9" fill="#111827"/>
  <text x="195" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#111827">DebtScope</text>
  <rect x="58" y="112" width="274" height="356" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="195" y="158" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#111827">Build your debt</text>
  <text x="195" y="184" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#111827">and cash-flow picture</text>
  <text x="78" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#374151">Import a credit card, loan, bank,</text>
  <text x="78" y="250" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#374151">or brokerage statement. DebtScope</text>
  <text x="78" y="270" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#374151">reads it locally and creates accounts.</text>
  <rect x="78" y="306" width="234" height="42" rx="12" fill="#2563eb"/>
  <text x="195" y="333" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#ffffff">Import Statement</text>
  <text x="195" y="371" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#2563eb">Watch How to Import</text>
  <rect x="78" y="390" width="234" height="38" rx="11" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="195" y="414" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#111827">Try Sample Data</text>
  <text x="78" y="454" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5" fill="#64748b">After import or sample data, DebtScope</text>
  <text x="78" y="469" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5" fill="#64748b">routes you to the right section.</text>
</svg>
