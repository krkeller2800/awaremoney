name = "debtscope-purchase-analytics"
main = "src/index.js"
compatibility_date = "2026-06-25"

[[routes]]
pattern = "komakode.com/api/debtscope/purchase-events"
zone_name = "komakode.com"

[[routes]]
pattern = "komakode.com/api/debtscope/purchase-summary"
zone_name = "komakode.com"

[[routes]]
pattern = "komakode.com/debtscope/purchase-analytics"
zone_name = "komakode.com"

[[d1_databases]]
binding = "PURCHASE_ANALYTICS_DB"
database_name = "debtscope_purchase_analytics"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[vars]
ANALYTICS_DISABLED = "false"
MAX_EVENT_AGE_DAYS = "180"
